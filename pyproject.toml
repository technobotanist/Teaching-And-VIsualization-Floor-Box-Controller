[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-display-controller"
version = "0.3.0"
description = "Local HDMI floor-box and projector-array controller for Hunt Library's Teaching & Visualization Lab"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "obsws-python>=1.7,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[project.scripts]
tv-display-controller = "tv_display_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tv_display_controller = ["web/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
